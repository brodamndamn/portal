server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/portal;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /isaac {
        return 301 /isaac/;
    }

    location = /isaac/api {
        return 301 /isaac/api/;
    }

    location ^~ /isaac/api/ {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /isaac/uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /isaac/ {
        root /var/www;
        try_files $uri $uri/ /isaac/index.html;
    }

    location = /research {
        return 301 /research/;
    }

    location = /research/api {
        return 301 /research/api/;
    }

    location ^~ /research/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        add_header X-Accel-Buffering no;
    }

    location ^~ /research/ {
        root /var/www;
        try_files $uri $uri/ /research/index.html;
    }

    # 旧 ISAAC 页面地址统一迁移到 /isaac/。
    location ~ ^/(items|characters|endings|guides|favorites|profile|transformations)(/.*)?$ {
        return 301 /isaac$request_uri;
    }

    # 临时兼容旧前端缓存；新版稳定后可移除该 API 代理。
    location ^~ /api/ {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 长期兼容数据库中已有的 /uploads/... 图片地址。
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
